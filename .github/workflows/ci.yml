name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    # Pinned so the ubuntu-latest move to a new release cannot change CI unannounced.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # The gitleaks CLI, not gitleaks-action: the action needs a paid license
      # for organization repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sudo tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks

      - name: Scan repository history for secrets
        run: gitleaks git --redact --verbose

      - name: Check source
        run: make lint-check

      - name: Check build references
        run: make references

      - name: Check dependency boundaries
        run: make boundaries

      - name: Test the brand tools
        run: make brand

      # clarity, pinned to the version used locally; CI is set, so the
      # cycles check fails rather than skips without it. The package skips
      # downloading its binary when CI is set, so it is installed without it.
      - name: Install clarity
        run: env -u CI npm install -g @legacycodehq/clarity@0.34.2

      - name: Check file cycles
        run: make cycles

      - name: Check the model's words are said only in packages/language
        run: make vocabulary

      - name: Audit dependencies
        run: make security

      - name: Set up Rust coverage
        run: rustup component add llvm-tools-preview

      - name: Install Rust coverage tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Check coverage
        run: make coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Check the tree-sitter grammar
        run: make grammar

      # Zed builds extensions for WebAssembly.
      - name: Set up Rust for the Zed extension
        run: rustup target add wasm32-wasip2

      # Needs full history, for the grammar commit extension.toml pins.
      - name: Check the Zed extension
        run: make zed

      # elan, pinned to the version used locally. It installs the Lean version
      # lean/lean-toolchain names the first time Lake runs.
      - name: Install Lean
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/elan.tar.gz"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            lean/.lake
          key: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-

      - name: Check the Lean specification
        run: make lean

      - name: Check the new implementation against the specification
        run: make agreement

      - name: Build and check the design notebook
        run: make notebook
        env:
          NOTEBOOK_BASE: /dxn/

      - name: Upload the design notebook
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: notebook/.vitepress/dist

      - name: Smoke-test the CLI
        run: make smoke

  publish-notebook:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: notebook-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish the design notebook
        id: deployment
        uses: actions/deploy-pages@v4
