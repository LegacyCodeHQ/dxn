name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # Pinned so the ubuntu-latest move to a new release cannot change CI unannounced.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # The gitleaks CLI, not gitleaks-action: the action needs a paid license
      # for organization repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sudo tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks

      - name: Scan repository history for secrets
        run: gitleaks git --redact --verbose

      - name: Check source
        run: make lint-check

      - name: Check build references
        run: make references

      # clarity, pinned to the version used locally; CI is set, so the
      # cycles check fails rather than skips without it.
      - name: Install clarity
        run: npm install -g @legacycodehq/clarity@0.34.2

      - name: Check file cycles
        run: make cycles

      - name: Audit dependencies
        run: make security

      - name: Check coverage
        run: make coverage

      - name: Check the tree-sitter grammar
        run: make grammar

      - name: Smoke-test the CLI
        run: make smoke
