id = "dxn-redesign"
name = "dxn redesign"
version = "0.1.0"
schema_version = 1
authors = ["Legacy Code Headquarters (OPC) Private Limited"]
description = "Language support for dxn: syntax highlighting, bracket matching, and inline errors for .dxn files."
repository = "https://github.com/LegacyCodeHQ/dxn"

# The development manifest is generated by make zed-dev with a local grammar
# snapshot. Install .dxn-dev/zed, not this template directory.

# The language server in packages/language-server, for inline errors. The
# extension starts the dxn-language-server it finds; see the README.
[language_servers.dxn-redesign-language-server]
name = "dxn language server"
languages = ["dxn"]
