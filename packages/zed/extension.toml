id = "dxn"
name = "dxn"
version = "0.1.0"
schema_version = 1
authors = ["Legacy Code Headquarters (OPC) Private Limited"]
description = "Language support for dxn: syntax highlighting, bracket matching, and inline errors for .dxn files."
repository = "https://github.com/LegacyCodeHQ/dxn"

# The grammar, at the commit of packages/tree-sitter-dxn that these queries
# are written against.
[grammars.dxn]
repository = "https://github.com/LegacyCodeHQ/dxn"
commit = "354642ff03883b17bca5940bb53a54639a1187d4"
path = "packages/tree-sitter-dxn"

# The language server in packages/language-server, for inline errors. The
# extension starts the dxn-language-server it finds; see the README.
[language_servers.dxn-language-server]
name = "dxn language server"
# JSON too, so the server reads a stored record's file as Zed has it, unsaved
# changes and all; it says nothing of a JSON file itself.
languages = ["dxn", "JSON"]
